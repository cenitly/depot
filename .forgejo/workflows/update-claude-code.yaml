name: Update claude-code
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
concurrency:
  group: update-claude-code
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  update:
    runs-on: native
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - id: update
        run: nix develop .#ci -c go run -C scripts ./cmd/update-claude-code
      - if: steps.update.outputs.updated == 'true'
        run: nix develop .#ci -c go run -C scripts ./cmd/create-pr "$VERSION" "$VERSION_PREVIOUS"
        env:
          VERSION: ${{ steps.update.outputs.version }}
          VERSION_PREVIOUS: ${{ steps.update.outputs.version_previous }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
      - if: failure()
        run: |
          nix develop .#ci -c go run -C scripts ./cmd/create-issue \
            "Automatic claude-code update failed" \
            "The automatic update workflow failed. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
